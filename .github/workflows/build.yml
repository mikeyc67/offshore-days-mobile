name: Build phone apps

# Run it from the Actions tab (Run workflow). Both apps are made from the live site and published on
# this repository's Releases page:
#   Android: https://github.com/<you>/offshore-days-mobile/releases/download/android-latest/OffshoreDays.apk
#   iPhone:  https://github.com/<you>/offshore-days-mobile/releases/download/ios-latest/OffshoreDays.ipa
on:
  workflow_dispatch:

permissions:
  contents: write   # to publish the finished apps as releases

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Get the app files from the live site
        run: bash get-www.sh

      - name: Install Capacitor
        run: npm install

      - name: Add Capacitor's page script (lets the page reach the phone's alerts and location)
        run: |
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          perl -0pi -e 's#<head>#<head><script src="capacitor.js"></script>#' www/index.html
          grep -q 'src="capacitor.js"' www/index.html

      - name: Create the Android project
        run: npx cap add android

      - name: Add the arrival alerts, permissions and icon
        run: |
          set -e
          # the native files can sit in native-android/ or at the top of the repository
          SRC=native-android; [ -d "$SRC" ] || SRC=.
          DEST=android/app/src/main/java/io/github/mikeyc67/offshoredays
          mkdir -p "$DEST"
          cp "$SRC"/*.java "$DEST/"
          python3 "$SRC/patch_manifest.py"
          printf "\ndependencies {\n    implementation 'com.google.android.gms:play-services-location:21.3.0'\n}\n" >> android/app/build.gradle
          # app icon from the site's icon, in each size Android uses
          sudo apt-get install -y -qq imagemagick >/dev/null
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*.xml
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=android/app/src/main/res/mipmap-${d%%:*}; size=${d##*:}
            convert www/icons/icon-512.png -resize ${size}x${size} "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

      - name: Copy the app files in
        run: npx cap sync android

      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../OffshoreDays.apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest OffshoreDays.apk --title "Android app (latest)" \
            --notes "Open this page on your Android phone and tap OffshoreDays.apk to install. Built $(date -u '+%d %b %Y %H:%M') UTC."

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get the app files from the live site
        run: bash get-www.sh

      - name: Install Capacitor
        run: npm install

      - name: Add Capacitor's page script (lets the page reach the phone's alerts and location)
        run: |
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          perl -0pi -e 's#<head>#<head><script src="capacitor.js"></script>#' www/index.html
          grep -q 'src="capacitor.js"' www/index.html

      - name: Create the iOS project
        run: npx cap add ios

      - name: Add the arrival alerts and app settings
        run: |
          set -e
          # the native files can sit in native-ios/ or at the top of the repository
          SRC=native-ios; [ -d "$SRC" ] || SRC=.
          cp "$SRC/FenceManager.swift" "$SRC/ShipFencePlugin.swift" "$SRC/MainViewController.swift" ios/App/App/
          cp "$SRC/AppDelegate.swift" ios/App/App/AppDelegate.swift
          ruby -e "require 'xcodeproj'" 2>/dev/null || gem install xcodeproj --no-document
          ruby "$SRC/add_files.rb"
          sed -i '' 's/customClass="CAPBridgeViewController" customModule="Capacitor"/customClass="MainViewController" customModule="App" customModuleProvider="target"/' ios/App/App/Base.lproj/Main.storyboard
          grep -q 'customClass="MainViewController"' ios/App/App/Base.lproj/Main.storyboard
          PL=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Checks whether you are next to one of your ships in port, to start a voyage log.'" "$PL"
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'Lets your iPhone alert you when you arrive at one of your ships in port, even with the app closed.'" "$PL"
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Offshore Days'" "$PL" || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Offshore Days'" "$PL"
          sips -z 1024 1024 www/icons/icon-512.png --out ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png

      - name: Copy the app files in
        run: npx cap sync ios

      - name: Build (unsigned; Sideloadly signs it with your Apple ID)
        run: |
          set -o pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive 2>&1 | tail -n 300

      - name: Package OffshoreDays.ipa
        run: |
          set -e
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -qry OffshoreDays.ipa Payload

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --yes --cleanup-tag || true
          gh release create ios-latest OffshoreDays.ipa --title "iPhone app (latest)" \
            --notes "Download OffshoreDays.ipa on your laptop and install it with Sideloadly. Built $(date -u '+%d %b %Y %H:%M') UTC."
